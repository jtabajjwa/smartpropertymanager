# Primora — {{ENV}} ({{DOMAIN}})
# Written by `primora deploy` on first install; Certbot adds the HTTPS parts.
# Changes here are kept: the deploy tool only writes this file when it's missing.

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    root /var/www/primora/{{ENV}}/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    access_log /var/log/nginx/primora-{{ENV}}.access.log;
    error_log  /var/log/nginx/primora-{{ENV}}.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
{{EXTRA_HEADERS}}
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite assets have content hashes in their names, so they can be cached for good.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm/primora-{{ENV}}.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root: each deploy switches the `current` link, and PHP must see the new path.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        internal;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
