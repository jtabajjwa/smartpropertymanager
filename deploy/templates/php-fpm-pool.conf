; Primora — {{ENV}}. Written by `primora deploy` on every deploy.
[primora-{{ENV}}]
user = {{APP_USER}}
group = {{APP_USER}}
listen = /run/php-fpm/primora-{{ENV}}.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = {{MAX_CHILDREN}}
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Laravel writes its own log (storage/logs); PHP fatals go to /var/log/php-fpm/error.log.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
security.limit_extensions = .php
